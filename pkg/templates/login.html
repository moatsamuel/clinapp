<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Clinapp-Login</title>

  <!-- Tailwind CSS -->

  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

    <!-- Main Page -->

  <div class="min-h-screen grid grid-cols-1 md:grid-cols-2">

    <!-- LEFT SIDE -->
    <div class="bg-gray-100 p-10">

    <div class="max-w-md mx-auto">

        <!-- Back Button -->
        <div class="mb-6">
        <a href="/">
            <svg
            class="w-6 h-6 text-green-500"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 8 14">

            <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M7 1 1.3 6.326a.91.91 0 0 0 0 1.348L7 13" />

            </svg>
        </a>
        </div>


        <!-- Logo -->
        <a href="#" class="flex items-center gap-2 mb-10">

        <div class="flex items-center justify-center
                    w-9 h-9 rounded-lg
                    bg-green-600 text-white
                    text-2xl font-bold">
            +
        </div>

        <span class="text-2xl font-bold text-slate-900">
            Clinapp
        </span>

        </a>


        <!-- Account Heading -->
        <p class="text-gray-600 font-bold mb-1 text-center text-2xl">
        Welcome Back
        </p>

        <p class="text-gray-500 text-center mb-8">
        Login to your Clinapp account
        </p>


        <!-- Login Form -->
        <form>


        <!-- Email -->
        <label class="block mb-2 font-bold text-gray-700">
            Email Address
        </label>

        <input
            type="email"
            placeholder="Enter your email"
            class="w-full p-3 border-2 border-transparent rounded-lg mb-4 shadow-md focus:outline-none focus:border-green-500">


        <!-- Password -->
        <label class="block mb-2 font-bold text-gray-700">
            Password
        </label>

        <input
            type="password"
            placeholder="Enter your password"
            class="w-full p-3 border-2 border-transparent rounded-lg shadow-md focus:outline-none focus:border-green-500">


        <!-- Forgot Password -->
        <div class="flex justify-end mt-3 mb-6">

            <a
            href="#"
            class="text-green-600 font-semibold hover:text-green-700">
            Forgot Password?
            </a>

        </div>


        <!-- Login Button -->
        <button
            type="submit"
            class="w-full p-3 bg-green-600 text-white rounded-lg transition duration-300 hover:bg-green-700 hover:scale-105">

            Login

        </button>

        </form>


        <!-- Sign Up -->
        <p class="text-center text-gray-700 mt-6 font-bold">

        Don't have an account?

        <a
            href="#"
            class="text-green-600 hover:text-green-700">

            Sign Up

        </a>

        </p>

    </div>

    </div>



    <!-- RIGHT SIDE -->
    <div class="bg-green-600 text-white flex items-center p-10">

    <div>

        <h2 class="text-4xl font-bold mb-6">

        Your Health,
        <br>
        Our Priority.

        </h2>


        <p class="text-lg mb-8">

        Login to Clinapp and manage your healthcare
        easily and securely.

        </p>


        <!-- Information Grid -->
        <div class="grid grid-cols-2 gap-4">


        <!-- Easy Access -->
        <div class="bg-green-500 p-4 rounded-lg">

            <h3 class="font-bold mb-2">
            Easy Access
            </h3>

            <p>
            Access your health information easily.
            </p>

        </div>


        <!-- Secure -->
        <div class="bg-green-500 p-4 rounded-lg">

            <h3 class="font-bold mb-2">
            Secure
            </h3>

            <p>
            Your information stays protected.
            </p>

        </div>


        </div>

    </div>

    </div>


  </div>

</body>

</html>
