<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Clinapp-signup</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100">
  <!-- Main Page -->
  <div class="min-h-screen grid grid-cols-1 md:grid-cols-2">


    <!-- LEFT SIDE -->
    <div class="bg-gray-100 p-10">

    <div class="max-w-md mx-auto">
        <div>
            <a href="/">
                <svg class="w-6 h-6 text-gray-800 text-green-500" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 8 14">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 1 1.3 6.326a.91.91 0 0 0 0 1.348L7 13"/>
                </svg>
            </a>
        </div>
        <!-- Logo -->
            <a href="#" class="flex items-center gap-2">
                    <div class="flex items-center justify-center
                                w-9 h-9 rounded-lg
                                bg-green-600 text-white
                                text-2xl font-bold">
                        +
                    </div>

                    <span class="text-2xl font-bold text-slate-900">
                        Clinapp
                    </span>
                </a>
        <!-- Account Heading -->
        <p class="text-gray-600 font-bold mb-1 text-center">
        Create your account
        </p>

        <!-- Sign Up Form -->
        <form>

        <!-- Full Name -->
        <label class="block mb-2 font-bold text-gray-700">
            Full Name
        </label>

        <input
            type="text"
            placeholder="Enter your full name"
            class="w-full p-3 border-2 border-transparent rounded-lg mb-4 shadow-md focus:outline-none focus:border-green-500">


        <!-- Email -->
        <label class="block mb-2 font-bold text-gray-700">
            Email Address
        </label>

        <input
            type="email"
            placeholder="Enter your email"
            class="w-full p-3 border-2 border-transparent rounded-lg mb-4 shadow-md focus:outline-none focus:border-green-500">


        <!-- Phone Number -->
        <label class="block mb-2 font-bold text-gray-700">
            Phone Number
        </label>

        <input
            type="tel"
            placeholder="Enter your phone number"
            class="w-full p-3 border-2 border-transparent rounded-lg mb-4 shadow-md focus:outline-none focus:border-green-500">


        <!-- Password -->
        <label class="block mb-2 font-bold text-gray-700">
            Password
        </label>

        <input
            type="password"
            placeholder="Create a password"
            class="w-full p-3 border-2 border-transparent rounded-lg mb-6 shadow-md focus:outline-none focus:border-green-500">


        <!-- Create Account Button -->
        <button
            type="submit"
            class="w-full p-3 bg-green-600 text-white rounded-lg transition duration-300 hover:scale-105">
        
            Create Account
        </button>

        </form>


        <!-- Login -->
        <p class="text-center text-gray-700 mt-6 font-bold">
        Already have an account?

        <a href="#" class="text-green-600">
            Login
        </a>
        </p>

    </div>

    </div>



    <!-- RIGHT SIDE -->
    <div class="bg-green-600 text-white flex items-center p-10">

      <div>

        <h2 class="text-4xl font-bold mb-6">
          Your Health,
          <br>
          Our Priority.
        </h2>

        <p class="text-lg mb-8">
          Join Clinapp and manage your healthcare
          easily and securely.
        </p>


        <!-- Information Grid -->
        <div class="grid grid-cols-2 gap-4">


          <!-- Easy Access -->
          <div class="bg-green-500 p-4 rounded-lg">

            <h3 class="font-bold mb-2">
              Easy Access
            </h3>

            <p>
              Access your health information easily.
            </p>

          </div>


          <!-- Secure -->
          <div class="bg-green-500 p-4 rounded-lg">

            <h3 class="font-bold mb-2">
              Secure
            </h3>

            <p>
              Your information stays protected.
            </p>

          </div>

        </div>

      </div>

    </div>


  </div>

</body>

</html>
