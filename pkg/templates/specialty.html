{% include "partials/header.html" %}


<section>
    <div>   


        <div class="bg-white p-8 md:p-10 rounded-2xl shadow-sm border border-gray-200">

			<h2 class="text-2xl font-bold text-slate-900 mb-2">
				Specialty Form
			</h2>

			<p class="text-gray-500 mb-8">
				Fill out the form below to add Specialty.
			</p>


			<form method="post" action="/contact">


				<!-- Full Name -->
				<div class="mb-5">

					<label
						for="name"
						class="block text-sm font-semibold text-slate-700 mb-2">
						Name of Specialty
					</label>

					<input
						id="name"
						name="name"
						type="text"
						placeholder="Add a Specialty"
						required
						class="w-full px-4 py-3 border border-gray-300 rounded-lg
							focus:outline-none focus:ring-2
							focus:ring-green-500 focus:border-green-500">

				</div>

				<!-- Message -->
				<div class="mb-6">

					<label
						for="message"
						class="block text-sm font-semibold text-slate-700 mb-2">
						Description
					</label>

					<textarea
						id="message"
						name="message"
						rows="5"
						placeholder="What kind of specialty is this..."
						required
						class="w-full px-4 py-3 border border-gray-300 rounded-lg
							resize-none focus:outline-none focus:ring-2
							focus:ring-green-500 focus:border-green-500"></textarea>

				</div>

               
                <div class="mb-6">
                    <select id="countries" placeholder="Not available" class="w-full px-4 py-3 border border-gray-300 rounded-lg
							focus:outline-none focus:ring-2
							focus:ring-green-500 focus:border-green-500">
                        <option selected block text-sm font-semibold text-slate-700 mb-2>Choose a availability</option>
                        <option value="US">Not available</option>
                        <option value="CA">Available</option>
                    </select>
                </div>
                

				<!-- Submit -->
				<button
					type="submit"
					class="w-full bg-green-700 hover:bg-green-800
						text-white font-semibold py-3 px-6
						rounded-lg transition duration-300">

					Submit

				</button>

			</form>

		</div>

    </div>
</section>

<div>

</div>
